name: Deploy tomb

# Packages ciphertext only. This workflow has no secrets and never sees the password.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/objects _site/src
          cp objects/*.enc.json _site/objects/ 2>/dev/null || true
          cp src/crypto.mjs _site/src/
          # Hard guard: refuse to deploy anything that looks like plaintext.
          if find _site -name '*.md' | grep -q .; then
            echo "plaintext .md found in _site, aborting" && exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
